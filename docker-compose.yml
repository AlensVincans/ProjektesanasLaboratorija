services:
  backend:
    build:
      context: ./flask-server
    environment:
      - FRONTEND_ORIGIN=https://lab.aleksandrsbelkins.info
      - PORT=5000
    env_file:
      - ./flask-server/.env
      - ./flask-server/auth.env
    volumes:
      - ./flask-server/db:/app/db

  frontend:
    build:
      context: ./react-client
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/docker-lab.aleksandrsbelkins.info.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/letsencrypt-webroot:/var/www/letsencrypt

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/letsencrypt-webroot:/var/www/letsencrypt
